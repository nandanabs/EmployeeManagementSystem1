<h3 class="page-title">Departments</h3>

<div class="row g-3">
  <div class="col-md-4">
    <div class="card p-3">
      <h5>{{ editingId ? 'Edit Department' : 'Add Department' }}</h5>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" formControlName="name" />
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3" formControlName="description"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-ems-primary">{{ editingId ? 'Update' : 'Add' }}</button>
          <button type="button" class="btn btn-outline-secondary" *ngIf="editingId" (click)="resetForm()">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="col-md-8">
    <div class="card p-3">
      <div class="text-center my-4" *ngIf="loading">
        <div class="spinner-border text-primary"></div>
      </div>

      <table class="table table-hover" *ngIf="!loading">
        <thead>
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let dept of departments">
            <td>{{ dept.name }}</td>
            <td>{{ dept.description || '-' }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-2" (click)="editDepartment(dept)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteDepartment(dept.id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="!departments.length">
            <td colspan="3" class="text-center text-muted">No departments yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
