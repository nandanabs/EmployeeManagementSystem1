<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="page-title mb-0">Employees</h3>
  <button class="btn btn-ems-primary" (click)="addEmployee()">
    <i class="bi bi-plus-lg me-1"></i>Add Employee
  </button>
</div>

<div class="card p-3 mb-3">
  <div class="row g-2">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Search by name, code or email..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()"
      />
    </div>
    <div class="col-md-4">
      <select class="form-select" [(ngModel)]="selectedDepartment" (ngModelChange)="loadEmployees()">
        <option [ngValue]="null">All Departments</option>
        <option *ngFor="let dept of departments" [ngValue]="dept.id">{{ dept.name }}</option>
      </select>
    </div>
  </div>
</div>

<div class="card p-3">
  <div class="text-center my-4" *ngIf="loading">
    <div class="spinner-border text-primary"></div>
  </div>

  <table class="table table-hover" *ngIf="!loading">
    <thead>
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Designation</th>
        <th>Status</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let emp of employees">
        <td>{{ emp.employee_code }}</td>
        <td>{{ emp.full_name }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.department_name || '-' }}</td>
        <td>{{ emp.designation_title || '-' }}</td>
        <td>
          <span class="badge" [ngClass]="emp.is_active ? 'bg-success' : 'bg-secondary'">
            {{ emp.is_active ? 'Active' : 'Inactive' }}
          </span>
        </td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-primary me-2" (click)="editEmployee(emp.id)">
            <i class="bi bi-pencil"></i>
          </button>
          <button
            class="btn btn-sm btn-outline-warning me-2"
            *ngIf="emp.is_active"
            (click)="deactivateEmployee(emp.id)"
          >
            <i class="bi bi-person-dash"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteEmployee(emp.id)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="!employees.length">
        <td colspan="7" class="text-center text-muted">No employees found.</td>
      </tr>
    </tbody>
  </table>
</div>
