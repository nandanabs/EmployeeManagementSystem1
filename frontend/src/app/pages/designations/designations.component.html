<h3 class="page-title">Designations</h3>

<div class="row g-3">
  <div class="col-md-4">
    <div class="card p-3">
      <h5>{{ editingId ? 'Edit Designation' : 'Add Designation' }}</h5>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" formControlName="title" />
        </div>
        <div class="mb-3">
          <label class="form-label">Department</label>
          <select class="form-select" formControlName="department">
            <option [ngValue]="null" disabled>Select department</option>
            <option *ngFor="let dept of departments" [ngValue]="dept.id">{{ dept.name }}</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-ems-primary">{{ editingId ? 'Update' : 'Add' }}</button>
          <button type="button" class="btn btn-outline-secondary" *ngIf="editingId" (click)="resetForm()">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="col-md-8">
    <div class="card p-3">
      <div class="text-center my-4" *ngIf="loading">
        <div class="spinner-border text-primary"></div>
      </div>

      <table class="table table-hover" *ngIf="!loading">
        <thead>
          <tr>
            <th>Title</th>
            <th>Department</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let designation of designations">
            <td>{{ designation.title }}</td>
            <td>{{ designation.department_name }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-2" (click)="editDesignation(designation)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteDesignation(designation.id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="!designations.length">
            <td colspan="3" class="text-center text-muted">No designations yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
