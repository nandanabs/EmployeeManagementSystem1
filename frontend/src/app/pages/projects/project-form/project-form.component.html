<h3 class="page-title">{{ isEditMode ? 'Edit Project' : 'New Project' }}</h3>

<div class="card p-4">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Project Name</label>
        <input type="text" class="form-control" formControlName="name" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Status</label>
        <select class="form-select" formControlName="status">
          <option value="PLANNING">Planning</option>
          <option value="ACTIVE">Active</option>
          <option value="COMPLETED">Completed</option>
        </select>
      </div>

      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="3" formControlName="description"></textarea>
      </div>

      <div class="col-md-4">
        <label class="form-label">Start Date</label>
        <input type="date" class="form-control" formControlName="start_date" />
      </div>
      <div class="col-md-4">
        <label class="form-label">End Date</label>
        <input type="date" class="form-control" formControlName="end_date" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Project Manager</label>
        <select class="form-select" formControlName="manager">
          <option [ngValue]="null">Select manager</option>
          <option *ngFor="let emp of employees" [ngValue]="emp.id">{{ emp.full_name }}</option>
        </select>
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-ems-primary">{{ isEditMode ? 'Update' : 'Create' }} Project</button>
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
