<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="page-title mb-0">Projects</h3>
  <button class="btn btn-ems-primary" *ngIf="isAdmin()" (click)="addProject()">
    <i class="bi bi-plus-lg me-1"></i>New Project
  </button>
</div>

<div class="card p-3 mb-3">
  <select class="form-select w-auto" [(ngModel)]="statusFilter" (ngModelChange)="loadProjects()">
    <option value="">All Statuses</option>
    <option value="PLANNING">Planning</option>
    <option value="ACTIVE">Active</option>
    <option value="COMPLETED">Completed</option>
  </select>
</div>

<div class="text-center my-4" *ngIf="loading">
  <div class="spinner-border text-primary"></div>
</div>

<div class="row g-3" *ngIf="!loading">
  <div class="col-md-4" *ngFor="let project of projects">
    <div class="card p-3 h-100">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <h5 class="mb-0">{{ project.name }}</h5>
        <span class="badge" [ngClass]="'badge-status-' + project.status.toLowerCase()">
          {{ project.status }}
        </span>
      </div>
      <p class="text-muted small mb-2">{{ project.description || 'No description provided.' }}</p>
      <p class="mb-1 small"><strong>Manager:</strong> {{ project.manager_name || 'Not assigned' }}</p>
      <p class="mb-1 small"><strong>Team size:</strong> {{ project.team_count }}</p>
      <p class="mb-3 small">
        <strong>Duration:</strong> {{ project.start_date || '-' }} to {{ project.end_date || '-' }}
      </p>

      <div class="d-flex gap-2 mt-auto">
        <button class="btn btn-sm btn-outline-primary" (click)="viewTeam(project.id)">
          <i class="bi bi-people"></i> Team
        </button>
        <button class="btn btn-sm btn-outline-secondary" *ngIf="isAdmin()" (click)="editProject(project.id)">
          <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-outline-warning" *ngIf="isAdmin()" (click)="deactivateProject(project.id)">
          <i class="bi bi-slash-circle"></i>
        </button>
        <button class="btn btn-sm btn-outline-danger" *ngIf="isAdmin()" (click)="deleteProject(project.id)">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="col-12" *ngIf="!projects.length">
    <p class="text-muted text-center">No projects found.</p>
  </div>
</div>
